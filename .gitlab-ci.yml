stages:
  - build_api
  - build_web
  - deploy

variables:
  DOCKER_HOST: "unix:///var/run/docker.sock"
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: "overlay2"

build_api:
  stage: build_api
  image: docker:24.0.5
  tags:
    - docker
    - serverless
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  script:
    - if [ ! -S /var/run/docker.sock ]; then echo "Docker socket missing. Configure runner to mount /var/run/docker.sock"; exit 1; fi
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build -f api/Dockerfile -t "$CI_REGISTRY_IMAGE/meals-api:$CI_COMMIT_SHA" api
    - docker push "$CI_REGISTRY_IMAGE/meals-api:$CI_COMMIT_SHA"

build_web:
  stage: build_web
  image: docker:24.0.5
  tags:
    - docker
    - serverless
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  script:
    - if [ ! -S /var/run/docker.sock ]; then echo "Docker socket missing. Configure runner to mount /var/run/docker.sock"; exit 1; fi
    - echo "$CI_JOB_TOKEN" | docker login -u gitlab-ci-token --password-stdin "$CI_REGISTRY"
    - docker build -f web/Dockerfile -t "$CI_REGISTRY_IMAGE/meals-web:$CI_COMMIT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE/meals-web:$CI_COMMIT_SHA"

deploy:
  stage: deploy
  image: alpine:3.19
  tags:
    - docker
    - serverless
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/meals-app}"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH"
    - scp -P "${SSH_PORT:-22}" docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "printf 'REGISTRY_IMAGE=%s\nIMAGE_TAG=%s\n' \"$CI_REGISTRY_IMAGE\" \"$CI_COMMIT_SHA\" > $DEPLOY_PATH/.env"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && echo \"$CI_JOB_TOKEN\" | docker login -u gitlab-ci-token --password-stdin $CI_REGISTRY"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && docker compose pull"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && docker compose run --rm api npx prisma migrate deploy"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && docker compose up -d --remove-orphans"
