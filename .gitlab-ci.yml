stages:
  - deploy

deploy:
  stage: deploy
  image: alpine:3.19
  tags:
    - docker
    - serverless
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        ssh-add "$SSH_PRIVATE_KEY"
      else
        if echo "$SSH_PRIVATE_KEY" | grep -q "BEGIN .* PRIVATE KEY"; then
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
        else
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' | base64 -d | ssh-add - || {
            echo "SSH_PRIVATE_KEY is not a valid key or base64-encoded key.";
            exit 1;
          }
        fi
      fi
    - ssh-keyscan -H -p "${SSH_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - export DEPLOY_PATH="${DEPLOY_PATH:-/home/ubuntu/meals-app}"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p $DEPLOY_PATH/current $DEPLOY_PATH/db $DEPLOY_PATH/config"
    - rsync -az --delete --exclude '.git' --exclude 'api/node_modules' --exclude 'web/node_modules' --exclude '.env' --exclude 'api/.env' --exclude 'web/.env' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/current/"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH/current && docker compose build"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH/current && docker compose run --rm api npx prisma migrate deploy"
    - ssh -p "${SSH_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH/current && docker compose up -d --remove-orphans"
