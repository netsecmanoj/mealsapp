services:
  api:
    image: ${REGISTRY_IMAGE:-local}/meals-api:${IMAGE_TAG:-dev}
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - ${API_ENV_FILE:-/home/ubuntu/meals-app/config/api.env}
    volumes:
      - ${API_DB_DIR:-/home/ubuntu/meals-app/db}:/data
    restart: unless-stopped

  web:
    image: ${REGISTRY_IMAGE:-local}/meals-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
