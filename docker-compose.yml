services:
  api:
    image: ${REGISTRY_IMAGE}/meals-api:${IMAGE_TAG}
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file:
      - /home/ubuntu/meals-app/config/api.env
    volumes:
      - /home/ubuntu/meals-app/db:/data
    restart: unless-stopped

  web:
    image: ${REGISTRY_IMAGE}/meals-web:${IMAGE_TAG}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8095:80"
    depends_on:
      - api
    restart: unless-stopped
