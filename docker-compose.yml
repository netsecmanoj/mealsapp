services:
  api:
    image: ${REGISTRY_IMAGE:-local}/meals-api:${IMAGE_TAG:-dev}
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ${API_ENV_FILE:-/home/ubuntu/meals-app/config/api.env}
    volumes:
      - ${API_DB_DIR:-/home/ubuntu/meals-app/db}:/data
    restart: unless-stopped

  web:
    image: ${REGISTRY_IMAGE:-local}/meals-web:${IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "8095:80"
    depends_on:
      - api
    restart: unless-stopped
